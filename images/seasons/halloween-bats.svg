    <path class="wing right" d="M92 45q35-42 75-31-22 8-10 29 15-13 22 2-24-1-33 28-18-18-48-9z"/>
    <path d="m82 43 1-23 13 15 13-15 1 23q6 20-14 31-20-11-14-31z"/>
  </g>
  <circle cx="87" cy="52" r="2.5" fill="#ffac53"/><circle cx="105" cy="52" r="2.5" fill="#ffac53"/>
</svg>
