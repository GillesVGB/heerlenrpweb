<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 90">
  <style>
    .wing{transform-box:fill-box;transform-origin:50% 60%;animation:flap .42s ease-in-out infinite alternate}
    .left{transform-origin:100% 70%}.right{transform-origin:0% 70%;animation-delay:-.12s}
    @keyframes flap{from{transform:rotate(-13deg) scaleY(.9)}to{transform:rotate(15deg) scaleY(1.08)}}
  </style>
